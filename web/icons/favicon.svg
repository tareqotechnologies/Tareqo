<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Paleta oficial: só #212121, #757575, #B7472A, #E0E0E0 -->
  <rect width="1024" height="1024" rx="200" fill="#212121"/>
  <!-- Simplified storefront shape -->
  <g fill="#E0E0E0">
    <!-- Roof -->
    <polygon points="160,170 864,170 834,360 194,360"/>
    <!-- Body -->
    <rect x="200" y="360" width="624" height="440"/>
    <!-- Pillars -->
    <rect x="200" y="360" width="55" height="440"/>
    <rect x="769" y="360" width="55" height="440"/>
    <!-- Door cutout: terracota (destaque oficial) -->
    <rect x="390" y="500" width="244" height="300" fill="#B7472A"/>
    <circle cx="512" cy="500" r="122" fill="#B7472A"/>
    <!-- Windows cutout -->
    <rect x="250" y="400" width="110" height="70" fill="#B7472A"/>
    <rect x="664" y="400" width="110" height="70" fill="#B7472A"/>
  </g>
</svg>
