org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Built-in Kotlin ATIVO (migração Flutter 3.47/AGP 9, Sep 18): o projeto estava
# em modo legado (builtInKotlin=false, da era 3.44) e nesse modo o
# mobile_scanner quebrava o build release (GeneratedPluginRegistrant não achava
# a classe do plugin — o FGP aplicava KGP ao subprojeto depois da avaliação do
# script). Com built-in Kotlin o AGP 9 compila o Kotlin dos plugins
# diretamente; mobile_scanner 7.4.2 e sentry_flutter 9.30.0 já são bimodais
# (aplicam KGP apenas quando builtInKotlin=false).
android.builtInKotlin=true
