org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# --- Avisos transitórios do AGP 9.0 (migração para built-in Kotlin) ---
# O Flutter 3.44 ainda roda em modo legado (KGP externo + DSL antigo) com AGP 9.0,
# e o AGP 9.0 deprecia essas duas flags. São transitórias: somem quando o projeto
# migrar para built-in Kotlin (Flutter 3.47+). Suprimimos o aviso aqui mantendo o
# comportamento atual (não mudar os valores acima — o Flutter migrator os re-adiciona).
# Obs.: a própria propriedade aparece na própria lista (último item) de propósito:
# o AGP verifica a lista de suprimidas ANTES de reportar o status "experimental"
# desta opção, então incluí-la evita que a supressão gere um aviso novo.
# Quando migrar para built-in Kotlin (Flutter 3.47+): remover estas duas linhas de
# supressão E as flags android.newDsl/android.builtInKotlin acima.
android.suppressUnsupportedOptionWarnings=android.builtInKotlin,android.newDsl,android.suppressUnsupportedOptionWarnings
# O KGP 2.3.x emite 'Deprecated org.jetbrains.kotlin.android plugin usage' em cada
# projeto AGP 9.0 (o Flutter Gradle Plugin aplica kotlin-android aos subprojetos em
# modo legado). Suprime pelo ID do diagnóstico (único ID na lista, sem efeitos
# colaterais sobre outros avisos do KGP).
kotlin.suppressGradlePluginWarnings=DeprecatedKotlinAndroidPlugin
