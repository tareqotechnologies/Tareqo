# Codemagic — build do iOS (IPA) para a Tareqo.
#
# Este ficheiro tem de ficar na raiz do repositório. O Codemagic deteta-o ao
# correr "Check for configuration file" na app.
#
# Workflows:
#   ios-unsigned — IPA sem assinatura. Não precisa de conta Apple nem de
#                  certificados; serve para validar o build e distribuir
#                  internamente (assinar depois com Xcode/fastlane).
#   windows-prod — EXE de produção empacotado em zip (mesmo artefato que a
#                  release publica como tareqo-windows.zip).
#   android-prod — APK + AAB de produção (flavor prod, assinado). Requer o
#                  keystore registado em Team settings > codemagic.yaml
#                  settings > Code signing identities com a referência
#                  `tareqo_keystore`.
#   ios-appstore — IPA assinado + TestFlight. Corre automaticamente em tags
#                  v*. Requer, no Codemagic:
#                    1. Team settings > Team integrations > Developer Portal >
#                       Manage keys: App Store Connect API key (access level
#                       App Manager). O nome do key tem de ser igual ao
#                       `integrations.app_store_connect` abaixo.
#                    2. Team settings > codemagic.yaml settings >
#                       Code signing identities: certificado Apple Distribution
#                       (.p12) e provisioning profile App Store de
#                       com.tareqo.tareqo.
#
# Variáveis de ambiente (Codemagic > Environment variables, marcadas como
# secretas/encrypted):
#   SUPABASE_URL        — URL do projeto Supabase de PRODUÇÃO
#   SUPABASE_ANON_KEY   — anon key do projeto de PRODUÇÃO
#   SENTRY_DSN          — opcional
#
# Notas do projeto:
#   - O iOS não usa flavors: o scheme é sempre `Runner` e o flavor de produção
#     entra pelo define `APP_FLAVOR=prod` (fallback lido por AppFlavorConfig).
#   - A guarda de release recusa defaults embutidos, por isso
#     SUPABASE_CREDENTIALS_EXPLICIT=true é obrigatório.
#   - O projeto iOS é Swift Package Manager puro (sem Podfile); resquícios de
#     CocoaPods são removidos antes do build.

workflows:
  ios-unsigned:
    name: Tareqo iOS (IPA sem assinatura)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.7
      xcode: latest
      cocoapods: default
    scripts:
      - name: Validar credenciais de produção
        script: |
          set -e
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Defina SUPABASE_URL e SUPABASE_ANON_KEY (encrypted) nas variáveis do Codemagic."
            exit 1
          fi

      - name: Dependências (SPM, sem CocoaPods)
        script: |
          set -e
          flutter pub get
          flutter config --enable-swift-package-manager
          rm -f ios/Podfile ios/Podfile.lock
          rm -rf ios/Pods ios/.symlinks

      - name: Build IPA (sem assinatura)
        script: |
          set -e
          # O número de build vem do pubspec (ex.: 2.6.0+31); usa-se o contador
          # do Codemagic apenas se for maior, para o TestFlight nunca receber
          # um CFBundleVersion inferior ao já publicado.
          PUB_BUILD=$(sed -n 's/^version:.*+\([0-9]*\).*/\1/p' pubspec.yaml)
          PUB_BUILD=${PUB_BUILD:-0}
          BUILD=${BUILD_NUMBER:-0}
          if [ "$BUILD" -le "$PUB_BUILD" ]; then BUILD=$PUB_BUILD; fi
          ARGS=(
            --dart-define=APP_FLAVOR=prod
            --dart-define=SUPABASE_URL="$SUPABASE_URL"
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
            --dart-define=SUPABASE_CREDENTIALS_EXPLICIT=true
            --build-number="$BUILD"
            --obfuscate
            --split-debug-info=build/symbols
          )
          if [ -n "$SENTRY_DSN" ]; then
            ARGS+=(--dart-define=SENTRY_DSN="$SENTRY_DSN")
          fi
          flutter build ipa --release --no-codesign "${ARGS[@]}"

      # `--no-codesign` arquiva mas não exporta IPA; empacota-se o Runner.app
      # no formato IPA legítimo (zip com Payload/) para assinar mais tarde.
      - name: Empacotar Runner.app como IPA
        script: |
          set -e
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if ls build/ios/ipa/*.ipa >/dev/null 2>&1; then
            echo "IPA gerado pelo Flutter."
          else
            APP=$(find build/ios -type d -name Runner.app | head -1)
            [ -n "$APP" ] || { echo "Runner.app não encontrado"; exit 1; }
            APPDIR=$(dirname "$APP")
            mkdir -p build/ios/ipa
            (cd "$APPDIR" && mkdir -p Payload && cp -R Runner.app Payload/ \
              && zip -qry "$OLDPWD/build/ios/ipa/tareqo-${VERSION}-unsigned.ipa" Payload \
              && rm -rf Payload)
          fi
          ls -lh build/ios/ipa/

    artifacts:
      - build/ios/ipa/*.ipa
      - build/symbols/*
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

  ios-appstore:
    name: Tareqo iOS (App Store / TestFlight)
    max_build_duration: 120
    instance_type: mac_mini_m2
    # Dispara automaticamente quando uma tag v* (ex.: v2.6.1+32) é enviada.
    # Requer a app ligada ao GitHub no Codemagic com os webhooks ativos, e a
    # tag tem de conter este ficheiro (tags anteriores não disparam nada).
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
      cancel_previous_builds: true
    integrations:
      # Nome do App Store Connect API key configurado no Codemagic.
      app_store_connect: tareqo_asc
    environment:
      flutter: 3.47.7
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tareqo.tareqo
    scripts:
      - name: Validar credenciais de produção
        script: |
          set -e
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Defina SUPABASE_URL e SUPABASE_ANON_KEY (encrypted) nas variáveis do Codemagic."
            exit 1
          fi

      - name: Dependências (SPM, sem CocoaPods)
        script: |
          set -e
          flutter pub get
          flutter config --enable-swift-package-manager
          rm -f ios/Podfile ios/Podfile.lock
          rm -rf ios/Pods ios/.symlinks

      - name: Aplicar certificados e provisioning profiles
        script: xcode-project use-profiles

      - name: Build IPA assinado
        script: |
          set -e
          PUB_BUILD=$(sed -n 's/^version:.*+\([0-9]*\).*/\1/p' pubspec.yaml)
          PUB_BUILD=${PUB_BUILD:-0}
          BUILD=${BUILD_NUMBER:-0}
          if [ "$BUILD" -le "$PUB_BUILD" ]; then BUILD=$PUB_BUILD; fi
          ARGS=(
            --dart-define=APP_FLAVOR=prod
            --dart-define=SUPABASE_URL="$SUPABASE_URL"
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
            --dart-define=SUPABASE_CREDENTIALS_EXPLICIT=true
            --build-number="$BUILD"
            --obfuscate
            --split-debug-info=build/symbols
          )
          if [ -n "$SENTRY_DSN" ]; then
            ARGS+=(--dart-define=SENTRY_DSN="$SENTRY_DSN")
          fi
          flutter build ipa --release --export-options-plist="$HOME/export_options.plist" "${ARGS[@]}"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/symbols/*
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Mude para true quando quiser enviar automaticamente ao TestFlight.
        # Requer o app record com o bundle id com.tareqo.tareqo já criado.
        submit_to_testflight: false

  android-prod:
    name: Tareqo Android (APK + AAB de produção)
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      flutter: 3.47.7
      java: 17
      android_signing:
        # Referência do keystore de upload configurado no Codemagic.
        - tareqo_keystore
    scripts:
      - name: Validar credenciais de produção
        script: |
          set -e
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Defina SUPABASE_URL e SUPABASE_ANON_KEY (encrypted) nas variáveis do Codemagic."
            exit 1
          fi

      # O Gradle lê android/key.properties (nunca versionado) e falha de
      # propósito se um build prodRelease não tiver keystore (ver
      # android/app/build.gradle.kts). O Codemagic expõe o keystore em
      # CM_KEYSTORE_PATH/CM_KEYSTORE_PASSWORD/CM_KEY_ALIAS/CM_KEY_PASSWORD.
      - name: Configurar assinatura de release
        script: |
          set -e
          if [ -z "$CM_KEYSTORE_PATH" ]; then
            echo "Keystore 'tareqo_keystore' não encontrado. Adicione-o em Code signing identities."
            exit 1
          fi
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$CM_KEYSTORE_PASSWORD" "$CM_KEY_PASSWORD" "$CM_KEY_ALIAS" "$CM_KEYSTORE_PATH" \
            > android/key.properties
          ls -l android/key.properties

      - name: Dependências
        script: flutter pub get

      - name: Build APK + AAB (flavor prod)
        script: |
          set -e
          # env/prod.env não é versionado: os defines vêm das variáveis do
          # Codemagic, com o marcador de credenciais explícitas exigido pela
          # guarda de release.
          DEFINES=(
            --dart-define=SUPABASE_URL="$SUPABASE_URL"
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
            --dart-define=SUPABASE_CREDENTIALS_EXPLICIT=true
            --obfuscate
            --split-debug-info=build/symbols
          )
          if [ -n "$SENTRY_DSN" ]; then
            DEFINES+=(--dart-define=SENTRY_DSN="$SENTRY_DSN")
          fi
          flutter build apk --flavor prod --release "${DEFINES[@]}"
          flutter build appbundle --flavor prod --release "${DEFINES[@]}"

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/**/*.aab
      - build/symbols/**
      - build/app/outputs/logs/*.txt

  windows-prod:
    name: Tareqo Windows (EXE de produção)
    max_build_duration: 120
    # windows_x2 exige faturação ativa na conta Codemagic.
    instance_type: windows_x2
    environment:
      flutter: 3.47.7
    scripts:
      # O runner Windows usa PowerShell por padrão: variáveis em $env:NOME.
      - name: Validar credenciais de produção
        script: |
          if (-not $env:SUPABASE_URL -or -not $env:SUPABASE_ANON_KEY) {
            Write-Error "Defina SUPABASE_URL e SUPABASE_ANON_KEY (encrypted) no Codemagic."
            exit 1
          }

      - name: Dependências
        script: flutter pub get

      - name: Build Windows (release)
        script: |
          $defines = @(
            "--dart-define=SUPABASE_URL=$env:SUPABASE_URL",
            "--dart-define=SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY",
            "--dart-define=SUPABASE_CREDENTIALS_EXPLICIT=true",
            "--obfuscate",
            "--split-debug-info=build/symbols"
          )
          if ($env:SENTRY_DSN) {
            $defines += "--dart-define=SENTRY_DSN=$env:SENTRY_DSN"
          }
          flutter build windows --release $defines

      # Mesmo nome de artefato usado pelos links da landing page
      # (releases/latest/download/tareqo-windows.zip).
      - name: Empacotar EXE em zip
        script: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "build/windows/tareqo-windows.zip" -Force

    artifacts:
      - build/windows/tareqo-windows.zip
      - build/symbols/**
