# Release — passo final antes da publicação (auditoria 2.4).
#
# Disparado por tag `v*` (ex.: `git tag v1.1.0 && git push --tags`):
#   1. test  — valida a suíte completa (flutter analyze + flutter test);
#   2. deploy — Fastlane: builda o AAB de PRODUÇÃO (--flavor prod, ofuscado,
#               assinado com o upload keystore) e faz upload para o track
#               Internal testing do Google Play Console.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   SUPABASE_URL_PROD / SUPABASE_ANON_KEY_PROD — defines de produção
#   KEYSTORE_BASE64                            — upload-keystore.jks em base64
#   KEYSTORE_PASSWORD                          — senha do cofre (PKCS12: uma só)
#   KEY_ALIAS                                  — alias da chave (padrão "upload")
#   PLAY_SERVICE_ACCOUNT_JSON                  — service account do Play (upload)
#   SENTRY_DSN (opcional)                      — observabilidade
#
# ⚠️ Pré-requisito único (manual): o app `com.dumbhanengue.dumbhanengue`
# precisa de existir no Play Console com o primeiro AAB/APK enviado e o
# "Play App Signing" ativado (ver docs/13-build-e-publicacao.md).
name: Release (Play Internal)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Coverage summary
        run: |
          if [ -f coverage/lcov.info ]; then
            pct=$(awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END {printf "%.1f", (lf>0 ? 100*lh/lf : 0)}' coverage/lcov.info)
            echo "Line coverage: ${pct}%"
            threshold=45.0
            below=$(awk -v p="$pct" -v t="$threshold" 'BEGIN { print (p < t) ? 1 : 0 }')
            if [ "$below" = "1" ]; then
              echo "::error::Coverage ${pct}% is below the ${threshold}% threshold"
              exit 1
            fi
          fi

  sql-check:
    name: SQL / RLS check (16 passos — W4/H2/upgrade/42710)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dumbhanengue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      # 16 passos: schema.sql + upgrade.sql 2x (idempotência) + RLS por loja
      # + RPCs atômicas + get_dashboard_kpis/get_cash_flow/get_sales_report
      # + migração W4 NUMERIC→centavos (25.50→2550, sem dupla aplicação)
      # + numeração sequencial + regressão 42710 (Realtime no cenário
      # Supabase) + catálogo de planos pl1/pl2/pl3.
      - name: Run SQL/RLS smoke test (W4/H2/upgrade)
        env:
          PGPASSWORD: postgres
        run: bash scripts/sql_check.sh localhost postgres dumbhanengue

  deploy:
    name: Build AAB + upload (Internal testing)
    runs-on: ubuntu-latest
    needs: [test, sql-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: fastlane

      # O ruby/setup-ruby com bundler-cache:true já instala as gems do
      # fastlane/Gemfile — não há passo separado de bundle install.

      - name: Build AAB + upload (Fastlane deploy)
        working-directory: fastlane
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: bundle exec fastlane deploy

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release-aab
          path: build/app/outputs/bundle/prodRelease/app-prod-release.aab

      - name: Upload Dart symbols
        uses: actions/upload-artifact@v4
        with:
          name: dart-symbols
          path: build/symbols
