# CI — Dumbhanengue ERP (auditoria H3/C1)
#
# Jobs:
#   analyze   — flutter analyze (zero erros/avisos);
#   test      — flutter test --coverage + resumo de cobertura;
#   build     — APK release Android (sem key.properties no CI → fallback de
#               assinatura debug; a assinatura real é feita fora do CI);
#   sql-check — smoke test do supabase/schema.sql + RLS contra um Postgres
#               real (scripts/sql_check.sh — checklist 6.2).
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --coverage
      - name: Coverage summary
        run: |
          if [ -f coverage/lcov.info ]; then
            pct=$(awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END {printf "%.1f", (lf>0 ? 100*lh/lf : 0)}' coverage/lcov.info)
            echo "Line coverage: ${pct}%"
            # Gate de cobertura: ajuste o limite após medir a linha de base.
            # threshold=50.0
          fi
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info

  build:
    name: Build (Android release APK)
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Sem key.properties no CI → assinatura debug (fallback) — valida que
      # o build de release compila. A assinatura de produção é feita com os
      # secrets do keystore em um workflow de release dedicado.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  sql-check:
    name: SQL / RLS check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dumbhanengue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Run SQL/RLS smoke test
        env:
          PGPASSWORD: postgres
        run: bash scripts/sql_check.sh localhost postgres dumbhanengue
