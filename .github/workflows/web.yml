# Publica a versão web da app na raiz do domínio app.dumbhanengue.com.
#
# URLs públicas:
#   app: https://app.dumbhanengue.com/
# O domínio personalizado deve estar configurado em Settings → Pages.
#
# Pré-requisitos, uma única vez:
#   Settings → Pages → Source: GitHub Actions;
#   Settings → Secrets and variables → Actions: SUPABASE_URL_PROD e
#   SUPABASE_ANON_KEY_PROD (os mesmos usados por downloads.yml/release.yml).
#
# Dispara em pushes na branch de deploy que alterem o conteúdo publicado
# (`lib/`, `web/`, `pubspec.*`), em tags `v*` (acompanha a
# release — o filtro de paths não se aplica a tags) e manualmente via
# workflow_dispatch. Só corre com os secrets acima configurados — sem eles
# o job aborta no primeiro passo.
name: Web (GitHub Pages)

on:
  push:
    branches:
      # Branch de produção do GitHub Pages: cada push publica.
      - feat/ui-standardization-telas
    tags:
      - "v*"
    # Evita um build de ~4 min em pushes que não mudam o site nem a app.
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Validate production secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY" || { echo '::error::Configure SUPABASE_URL_PROD e SUPABASE_ANON_KEY_PROD (Settings → Secrets and variables → Actions).'; exit 1; }
      - run: flutter pub get
      - name: Build web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
        # Sem --obfuscate: o build web não suporta a flag de ofuscação AOT.
        run: flutter build web --release --base-href=/ --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" --dart-define=SUPABASE_CREDENTIALS_EXPLICIT=true
      - name: Montar site publicado
        # O domínio dedicado serve a app na raiz; o CNAME acompanha o artefacto
        # para persistir entre deployments feitos por GitHub Actions.
        run: |
          mkdir -p public
          cp -r build/web/. public/
          printf '%s\n' 'app.dumbhanengue.com' > public/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Publicar no Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
