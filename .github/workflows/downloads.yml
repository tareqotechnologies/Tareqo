# Build and attach the public Android APK and standalone Windows installer
# whenever a version tag is pushed.
name: Public downloads

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    name: Android production APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - name: Validate production secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY" && test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" || { echo '::error::Configure os secrets de produção Supabase e assinatura Android.'; exit 1; }
      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" "${KEY_ALIAS:-upload}" > android/key.properties
      - run: flutter pub get
      - name: Build production APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
        run: flutter build apk --flavor prod --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" --dart-define=SUPABASE_CREDENTIALS_EXPLICIT=true --obfuscate --split-debug-info=build/symbols
      - name: Name public APK
        run: cp build/app/outputs/flutter-apk/app-prod-release.apk build/app/outputs/flutter-apk/tareqo-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: tareqo-android
          path: build/app/outputs/flutter-apk/tareqo-android.apk

  windows:
    name: Standalone Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - name: Validate production secrets
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
        run: |
          if (-not $env:SUPABASE_URL -or -not $env:SUPABASE_ANON_KEY) { throw 'Configure SUPABASE_URL_PROD e SUPABASE_ANON_KEY_PROD.' }
      - run: flutter pub get
      - name: Build Windows release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
        run: flutter build windows --release --dart-define=SUPABASE_URL="$env:SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$env:SUPABASE_ANON_KEY" --dart-define=SUPABASE_CREDENTIALS_EXPLICIT=true
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build standalone installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*" -Filter ISCC.exe -Recurse | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe não encontrado após instalar o Inno Setup.' }
          & $iscc.FullName installer\tareqo.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC terminou com código $LASTEXITCODE" }
      - uses: actions/upload-artifact@v7
        with:
          name: tareqo-windows
          path: dist/TAREQO_SETUP.exe

  publish:
    name: Publish GitHub release assets
    runs-on: ubuntu-latest
    needs: [android, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tareqo-android
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: tareqo-windows
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          name: Tareqo ${{ github.ref_name }}
          files: |
            release-assets/tareqo-android.apk
            release-assets/TAREQO_SETUP.exe
          generate_release_notes: true
