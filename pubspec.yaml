name: tareqo
description: "TAREQO — sistema de gestão empresarial (estoque, vendas, clientes, compras e relatórios) construído em Flutter com Clean Architecture."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.2.0+27

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Ícones padrão do Material (iOS style)
  cupertino_icons: ^1.0.8

  # --- Gerenciamento de estado (Riverpod 3) ---
  # Consumido pela camada de apresentação (providers, notifiers).
  flutter_riverpod: ^3.4.2

  # --- Injeção de dependência (Service Locator) ---
  # Registra datasources, repositórios e casos de uso no bootstrap.
  get_it: ^9.2.1

  # --- Modelos imutáveis e serialização (anotações do Freezed) ---
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  supabase_flutter: ^2.16.0
  # Deep links de autenticação (confirmação de e-mail / OAuth com PKCE): o
  # link do e-mail (tareqo://callback) reabre o app e conclui o fluxo
  # — ver core/network/deep_link_handler.dart e o site_url no Supabase.
  app_links: ^7.2.1
  # postgrest: exceções do cliente do Supabase — usada em PRODUÇÃO agora
  # (tradução dos erros da RPC set_employee_active no datasource remoto de
  # funcionários; antes só nos testes do SupabaseEmployeeProcessor).
  # ^2.9.1 (M9): 2.8.0 exato travava o supabase_flutter em 2.16.0 (o 2.17.x
  # exige postgrest 2.9+) — as exceções (PostgrestException) são estáveis em 2.x.
  postgrest: ^2.9.1
  # W6: cliente HTTP central com timeout + retry de leituras idempotentes
  # (injetado no Supabase.initialize — ver core/network).
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  # W10 (checklist 8.2): sqlite3 3.x usa BUILD HOOKS (native assets) — o
  # próprio pacote compila/empacota o SQLite para Android/iOS/desktop, sem
  # precisar de sqlite3_flutter_libs nem de sqlite3_android (o loader
  # manual/open.overrideFor foi removido de AppDatabase). Ver changelog
  # 3.0.0: "Use build hooks to load SQLite instead of DynamicLibrary".
  sqlite3: ^3.5.1
  path_provider: ^2.1.6
  path: ^1.9.1

  # --- Internacionalização (idioma pt/en/fr + formatação de moeda) ---
  # O dono do tenant escolhe moeda (BRL/USD/EUR/MZN) e idioma (pt/en/fr).
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  # 9.x: corrige a incompatibilidade com o Kotlin "built-in" do Flutter
  # 3.44+ (o 8.14.2 fixava languageVersion=1.6 e quebrava o build de
  # release — falha pré-existente do CI, auditoria M4/7.7).
  #
  # ⚠️ AVISO CONHECIDO (build AGP 9+, Flutter 3.44): o android/build.gradle
  # do sentry_flutter ainda aplica `apply plugin: 'kotlin-android'` (KGP), e o
  # tooling do Flutter emite: "Your app uses the following plugins that apply
  # Kotlin Gradle Plugin (KGP): sentry_flutter — Future versions of Flutter
  # will fail to build". É BENIGNO hoje (apenas aviso, o build passa) e NÃO há
  # como suprimir via gradle.properties. Nenhuma versão publicada corrige
  # ainda: o 9.26.0, o 10.0.0-alpha.3 e até o main do sentry-dart aplicam KGP.
  # A migração upstream (getsentry/sentry-dart#3738, DART-382) está prevista
  # para o v10 estável (~fim de ago/meio de set 2026, bloqueada no jni).
  # Quando o v10 sair: subir para ^10.0.0 — o aviso desaparece sozinho.
  sentry_flutter: ^9.30.0
  mobile_scanner: ^7.4.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  pdf: ^3.13.0
  image_picker: ^1.2.3
  # Autenticação biométrica (W10 — auditoria 2026-08)
  local_auth: ^2.3.0
  local_auth_android: ^1.0.46
  local_auth_darwin: ^1.2.8

  # MFA/TOTP + QR code para configurar autenticador
  otp: ^3.1.1
  qr_flutter: ^4.1.0

  # Criptografia AES-GCM para cifrar payloads offline (auditoria 2026-08)
  cryptography: ^2.7.2
  flutter_markdown_plus: ^1.0.12

  # Template PERSISTENTE de Factura/Cotação (invoice_template_providers) —
  # já transitiva via supabase_flutter; declarada aqui por uso direto
  # (lint depend_on_referenced_packages). Fixada à mesma faixa do lock.
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Timers fake para os testes do auto-drain (OfflineSyncService) e do
  # AddOnExpiryService — já transitivo via flutter_test, declarado aqui
  # para satisfazer o lint depend_on_referenced_packages.
  fake_async: ^1.3.1

  # Mock do getTemporaryPath nos testes dos exporters/share (mesma lógica:
  # já transitivo via path_provider).
  path_provider_platform_interface: ^2.1.3

  # Backend in-memory do SharedPreferencesAsync nos testes do template
  # persistente de Factura/Cotação (transitiva via shared_preferences).
  shared_preferences_platform_interface: ^2.4.2

  # Testes do BiometricService trocam LocalAuthPlatform.instance (padrão do
  # próprio plugin local_auth) — já transitivo via local_auth, declarado
  # aqui para satisfazer o lint depend_on_referenced_packages.
  local_auth_platform_interface: ^1.1.0
  plugin_platform_interface: ^2.1.8

  # Teste do DeepLinkHandler.init substitui AppLinksPlatform.instance
  # (mesmo padrão dos plugins acima) — já transitivo via app_links.
  app_links_platform_interface: ^2.0.4
  # gotrue: API de MFA (fatores TOTP) do GoTrue — usada pelo tool de
  # matrícula de MFA do owner (tool/enroll_owner_mfa.dart). Transitiva via
  # supabase_flutter; fixada à mesma faixa já resolvida no lock.
  gotrue: ^2.27.2

  # Testes de integração E2E no browser (Chrome) contra o Supabase real:
  # flutter test integration_test -d chrome --dart-define-from-file=env/dev.env
  # (as credenciais reais são passadas via --dart-define=TEST_*_EMAIL/PASSWORD).
  integration_test:
    sdk: flutter

  # Conjunto de lints recomendados pelo Flutter
  flutter_lints: ^6.0.0

  # --- Branding (W7) ---
  # Gera os ícones nativos a partir de assets/branding (gerados por
  # tool/generate_icons_test.dart): `dart run flutter_launcher_icons`.
  flutter_launcher_icons: ^0.14.3

  # --- Geração de código (Freezed + json_serializable) ---
  # Execute `dart run build_runner build --delete-conflicting-outputs`
  # sempre que criar/alterar classes anotadas com @freezed.
  # freezed pinado à última versão estável (3.2.5).
  build_runner: ^2.15.1
  freezed: ">=3.2.5 <3.2.6"
  json_serializable: ^6.14.1

flutter:
  # Gera o código de localização (AppLocalizations) a partir dos ARBs em
  # lib/l10n (ver l10n.yaml) — requisito do flutter gen-l10n.
  generate: true

  # Garante que a fonte de ícones Material esteja incluída no aplicativo.
  uses-material-design: true

  # Logotipo oficial da marca (azul/branco) — usada pela tela de
  # abertura in-app (_SplashScreen do AuthGate). Gerada por
  # tool/generate_icons_test.dart a partir de assets/branding/icon_official.png
  # (que por sua vez é gerado por tool/apply_official_icon.py a partir do
  # anexo oficial do utilizador).
  assets:
    # Branding — imagens da marca oficial (splash, login, onboarding).
    - assets/branding/icon_official.png
    - assets/branding/splash_logo.png
    - assets/branding/icon_fg.png
    - assets/branding/play_store_icon.png
    # Guias de suporte embutidos (ecrã Ajuda — Lojas → Ajustes → Suporte):
    # os mesmos documentos de docs/, empacotados no app para leitura offline.
    - docs/pt/GUIA_DO_USUARIO.md
    - docs/pt/TROUBLESHOOTING.md
    - docs/en/USER_GUIDE.md
    - docs/en/TROUBLESHOOTING.md
    - docs/fr/GUIDE_DE_L_UTILISATEUR.md
    - docs/fr/DEPANNAGE.md

  # Fonte tipográfica do ERP: Inter (variável, eixo opsz+wght).
  # Escolhida por legibilidade em telas densas de dados (ERP) e suporte
  # nativo a pesos via eixo wght no Flutter (fontWeight mapeia o eixo).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

# Ícones nativos (W7) — gerados por tool/generate_icons_test.dart a partir
# da imagem-fonte assets/branding/icon_official.png (design OFICIAL do
# utilizador: quadrado azul arredondado + arco + "D" branco + ponto azul,
# aplicado por tool/apply_official_icon.py). Correr:
#   python tool/apply_official_icon.py
#   flutter test tool/generate_icons_test.dart && dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icon_legacy.png"
  # Fundo BRANCO do adaptativo — a mesma cara do .ico oficial (fundo branco
  # + logotipo azul no foreground, keyado).
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/branding/icon_fg.png"
  adaptive_icon_monochrome: "assets/branding/icon_mono.png"
  remove_alpha_ios: true
  # Windows desktop: gera o app_icon.ico (multi-tamanho) com o ícone oficial
  # completo (fundo branco + sacola azul + D) — mesmo desenho do Android/iOS.
  windows:
    generate: true
    image_path: "assets/branding/icon_legacy.png"
    icon_size: 256
