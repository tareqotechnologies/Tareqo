name: dumbhanengue
description: "ERP Dumbhanengue — sistema de gestão empresarial (estoque, vendas, clientes, compras e relatórios) construído em Flutter com Clean Architecture."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Ícones padrão do Material (iOS style)
  cupertino_icons: ^1.0.8

  # --- Gerenciamento de estado (Riverpod 3) ---
  # Consumido pela camada de apresentação (providers, notifiers).
  flutter_riverpod: ^3.4.2

  # --- Injeção de dependência (Service Locator) ---
  # Registra datasources, repositórios e casos de uso no bootstrap.
  get_it: ^9.2.1

  # --- Modelos imutáveis e serialização (anotações do Freezed) ---
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  supabase_flutter: ^2.16.0
  # W6: cliente HTTP central com timeout + retry de leituras idempotentes
  # (injetado no Supabase.initialize — ver core/network).
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  sqlite3: 2.9.0
  # 0.6.0+eol: última versão (EOL) — recompilada contra compileSdk 36;
  # a 0.5.27 era compilada contra android-32 e QUEBRAVA o build de release
  # (falha pré-existente do CI, auditoria M4/8.2). Migração futura:
  # sqlite3_android (lib nativa do SO) — ver checklist 8.2.
  sqlite3_flutter_libs: 0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1

  # --- Internacionalização (idioma pt/en + formatação de moeda) ---
  # O dono do tenant escolhe moeda (BRL/USD/EUR/MZN) e idioma (pt/en).
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  # 9.x: corrige a incompatibilidade com o Kotlin "built-in" do Flutter
  # 3.44+ (o 8.14.2 fixava languageVersion=1.6 e quebrava o build de
  # release — falha pré-existente do CI, auditoria M4/7.7).
  sentry_flutter: ^9.26.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Testes de integração E2E no browser (Chrome) contra o Supabase real:
  # flutter test integration_test -d chrome --dart-define-from-file=env/dev.env
  # (as credenciais reais são passadas via --dart-define=TEST_*_EMAIL/PASSWORD).
  integration_test:
    sdk: flutter

  # Conjunto de lints recomendados pelo Flutter
  flutter_lints: ^6.0.0

  # O teste de SupabaseEmployeeProcessor constrói PostgrestException
  # (tradução dos erros da RPC create_employee_account) — dependência
  # transitiva do supabase_flutter declarada explicitamente para os testes
  # (depend_on_referenced_packages).
  postgrest: 2.8.0

  # --- Branding (W7) ---
  # Gera os ícones nativos a partir de assets/branding (gerados por
  # tool/generate_icons_test.dart): `dart run flutter_launcher_icons`.
  flutter_launcher_icons: ^0.14.3

  # --- Geração de código (Freezed + json_serializable) ---
  # Execute `dart run build_runner build --delete-conflicting-outputs`
  # sempre que criar/alterar classes anotadas com @freezed.
  # freezed pinado à última versão estável (3.2.5).
  build_runner: ^2.15.1
  freezed: ">=3.2.5 <3.2.6"
  json_serializable: ^6.14.1

flutter:
  # Gera o código de localização (AppLocalizations) a partir dos ARBs em
  # lib/l10n (ver l10n.yaml) — requisito do flutter gen-l10n.
  generate: true

  # Garante que a fonte de ícones Material esteja incluída no aplicativo.
  uses-material-design: true

  # Para adicionar assets:
  # assets:
  #   - assets/images/

  # Para adicionar fontes customizadas:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf

# Ícones nativos (W7) — gerados por tool/generate_icons_test.dart.
# Correr: flutter test tool/generate_icons_test.dart && dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icon_legacy.png"
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: "assets/branding/icon_fg.png"
  adaptive_icon_monochrome: "assets/branding/icon_fg.png"
  remove_alpha_ios: true
