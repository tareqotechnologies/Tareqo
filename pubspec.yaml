name: dumbhanengue
description: "ERP Dumbhanengue — sistema de gestão empresarial (estoque, vendas, clientes, compras e relatórios) construído em Flutter com Clean Architecture."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Ícones padrão do Material (iOS style)
  cupertino_icons: ^1.0.8

  # --- Gerenciamento de estado (Riverpod 3) ---
  # Consumido pela camada de apresentação (providers, notifiers).
  flutter_riverpod: ^3.4.2

  # --- Injeção de dependência (Service Locator) ---
  # Registra datasources, repositórios e casos de uso no bootstrap.
  get_it: ^9.2.1

  # --- Modelos imutáveis e serialização (anotações do Freezed) ---
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  supabase_flutter: ^2.16.0
  flutter_secure_storage: ^10.3.1
  sqlite3: 2.9.0
  sqlite3_flutter_libs: 0.5.27
  path_provider: ^2.1.6
  path: ^1.9.1

  # --- Internacionalização (idioma pt/en + formatação de moeda) ---
  # O dono do tenant escolhe moeda (BRL/USD/EUR/MZN) e idioma (pt/en).
  flutter_localizations:
    sdk: flutter
  intl: any
  sentry_flutter: ^8.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Conjunto de lints recomendados pelo Flutter
  flutter_lints: ^6.0.0

  # --- Geração de código (Freezed + json_serializable) ---
  # Execute `dart run build_runner build --delete-conflicting-outputs`
  # sempre que criar/alterar classes anotadas com @freezed.
  # freezed pinado à última versão estável (3.2.5).
  build_runner: ^2.15.1
  freezed: ">=3.2.5 <3.2.6"
  json_serializable: ^6.14.1

flutter:
  # Gera o código de localização (AppLocalizations) a partir dos ARBs em
  # lib/l10n (ver l10n.yaml) — requisito do flutter gen-l10n.
  generate: true

  # Garante que a fonte de ícones Material esteja incluída no aplicativo.
  uses-material-design: true

  # Para adicionar assets:
  # assets:
  #   - assets/images/

  # Para adicionar fontes customizadas:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
